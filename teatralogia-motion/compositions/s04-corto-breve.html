<template>
  <style>
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 700; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; font-family: "DM Sans", sans-serif; color: #fff; }
    #s4-cam { position: absolute; inset: 0; transform-origin: 50% 47%; }
    /* Fase A: el choque */
    .s4-pal { position: absolute; top: 842px; font-weight: 700; font-size: 108px; line-height: 1; letter-spacing: 0.02em; }
    #s4-corto { right: 615px; }
    #s4-breve { left: 615px; }
    #s4-neq { position: absolute; left: 495px; top: 838px; width: 90px; height: 116px; }
    #s4-onda { position: absolute; left: 340px; top: 690px; width: 400px; height: 400px; border-radius: 50%;
      border: 3px solid #fff; opacity: 0; }
    /* Fase B: dos mitades */
    #s4-divisor { position: absolute; left: 110px; width: 860px; top: 868px; height: 2px; background: #888888;
      transform-origin: 0 50%; }
    #s4-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s4-breve-t { position: absolute; left: 110px; top: 935px; font-weight: 700; font-size: 84px; opacity: 0; }
    .s4-frase { position: absolute; left: 110px; width: 860px; top: 1050px; font-weight: 400; font-size: 64px; line-height: 1.15; }
    #s4-limpia { visibility: hidden; }
    #s4-sucia .x { color: #888888; }
    #s4-sucia span { display: inline-block; }
    #s4-sucia { opacity: 0; }
    #s4-subraya { position: absolute; left: 110px; top: 1215px; width: 420px; height: 3px; background: #fff;
      transform-origin: 0 50%; }
  </style>
  <div id="root" data-composition-id="s04-corto-breve" data-width="1080" data-height="1920">
    <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="s4-onda"></div>
      <div class="s4-pal" id="s4-corto">CORTO</div>
      <div class="s4-pal" id="s4-breve">BREVE</div>
      <svg id="s4-neq" viewBox="0 0 90 116" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round">
        <line id="s4-n1" x1="8" y1="44" x2="82" y2="44" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <line id="s4-n2" x1="8" y1="74" x2="82" y2="74" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <line id="s4-n3" x1="66" y1="8" x2="24" y2="108" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
      </svg>
      <div id="s4-divisor"></div>
      <!-- Mitad superior: "Corto" se dibuja en canvas para poder desintegrarse en partículas -->
      <canvas id="s4-canvas" width="1080" height="1920" data-layout-ignore></canvas>
      <!-- Mitad inferior: las letras de sobra caen y lo esencial se encastra -->
      <div id="s4-breve-t">Breve:</div>
      <div class="s4-frase" id="s4-limpia" aria-hidden="true">lo que no tiene<br />nada de más.</div>
      <div class="s4-frase" id="s4-sucia"></div>
      <div id="s4-subraya"></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Frase con letras de sobra: "+" marca la letra que sobra
    const SUCIA = [["l","o","+o"," ","q","u","e","+e"," ","n","o","+o"," ","t","i","e","n","e","+e"], ["n","a","d","a","+a"," ","d","e","+e"," ","m","á","s","+s","."]];
    const sucia = document.querySelector("#s4-sucia");
    const letras = [];
    SUCIA.forEach((linea, li) => {
      linea.forEach((ch) => {
        const s = document.createElement("span");
        const extra = ch.startsWith("+");
        s.textContent = extra ? ch.slice(1) : ch === " " ? " " : ch;
        if (extra) s.className = "x";
        sucia.appendChild(s);
        letras.push({ el: s, extra, ch: extra ? ch.slice(1) : ch });
      });
      if (li === 0) sucia.appendChild(document.createElement("br"));
    });

    let seed = 0xc0870;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

    const build = () => {
      // ---- Fase A: CORTO y BREVE chocan en el centro ----
      tl.fromTo("#s4-corto", { x: -900 }, { x: 75, duration: 0.35, ease: "expo.in" }, 0);
      tl.fromTo("#s4-breve", { x: 900 }, { x: -75, duration: 0.35, ease: "expo.in" }, 0);
      tl.to("#s4-corto", { x: 0, duration: 0.4, ease: "back.out(2.2)" }, 0.35);
      tl.to("#s4-breve", { x: 0, duration: 0.4, ease: "back.out(2.2)" }, 0.35);
      tl.fromTo("#s4-corto, #s4-breve", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.12, ease: "power2.out", immediateRender: false }, 0.35);
      tl.fromTo("#s4-onda", { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "expo.out", immediateRender: false }, 0.35);
      // Sacudida de cámara en el impacto
      [[18, -10], [-14, 8], [8, -4], [0, 0]].forEach(([x, y], i) =>
        tl.to("#s4-cam", { x, y, duration: 0.033, ease: "none" }, 0.35 + i * 0.033));
      tl.fromTo("#s4-cam", { scale: 1.07 }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 0.35);
      // El ≠ se dibuja con trazo de marcador
      [["#s4-n1", 0.72], ["#s4-n2", 0.92], ["#s4-n3", 1.12]].forEach(([sel, t]) =>
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.inOut", immediateRender: false }, t));

      // ---- Fase B: se separan en dos mitades ----
      tl.to("#s4-corto", { y: -420, opacity: 0, duration: 0.3, ease: "expo.in" }, 1.6);
      tl.to("#s4-breve", { y: 420, opacity: 0, duration: 0.3, ease: "expo.in" }, 1.6);
      tl.to("#s4-neq", { scale: 0, opacity: 0, duration: 0.25, ease: "expo.in" }, 1.6);
      tl.fromTo("#s4-divisor", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 1.75);

      // Canvas: "Corto: lo que termina rápido." nítido, después partículas tipo arena
      const cv = document.querySelector("#s4-canvas");
      const ctx = cv.getContext("2d");
      const drawText = (c) => {
        c.fillStyle = "#fff";
        c.textBaseline = "top";
        c.font = '700 84px "DM Sans"';
        c.fillText("Corto:", 110, 440);
        c.font = '400 64px "DM Sans"';
        c.fillText("lo que termina", 110, 560);
        c.fillText("rápido.", 110, 638);
      };
      // Muestreo de los píxeles del texto (una sola vez, en la construcción)
      const off = document.createElement("canvas");
      off.width = 1080; off.height = 1920;
      const octx = off.getContext("2d");
      drawText(octx);
      const data = octx.getImageData(0, 400, 1080, 340).data;
      const parts = [];
      for (let y = 0; y < 340; y += 3) {
        for (let x = 0; x < 1080; x += 3) {
          if (data[(y * 1080 + x) * 4 + 3] > 120) {
            parts.push({ x, y: y + 400, vx: 180 + rnd() * 520, vy: -(120 + rnd() * 420), d: (x - 110) / 900 * 0.45 + rnd() * 0.12, w: 2 + rnd() * 6, s: 1.6 + rnd() * 1.6 });
          }
        }
      }
      const IN = 1.75, OUT = 3.3;
      const paint = (t) => {
        ctx.clearRect(0, 0, 1080, 1920);
        if (t < IN) return;
        if (t < OUT) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, (t - IN) / 0.2);
          ctx.translate(0, (1 - Math.min(1, (t - IN) / 0.25)) * 30);
          drawText(ctx);
          ctx.restore();
          return;
        }
        ctx.fillStyle = "#fff";
        for (const p of parts) {
          const k = Math.max(0, t - OUT - p.d);
          const a = Math.max(0, 1 - k / 0.9);
          if (a <= 0) continue;
          ctx.globalAlpha = a;
          const x = p.x + p.vx * k * k * 1.4 + Math.sin(k * p.w) * 12 * k;
          const y = p.y + p.vy * k * k;
          ctx.fillRect(x, y, p.s, p.s);
        }
        ctx.globalAlpha = 1;
      };
      const reloj = { t: 0 };
      tl.fromTo(reloj, { t: 0 }, { t: 6, duration: 6, ease: "none", onUpdate: () => paint(reloj.t) }, 0);

      // Mitad inferior: dónde termina cada letra esencial cuando se van las de sobra.
      // Se calcula con la métrica de la fuente (measureText), no midiendo el DOM: no depende de la escala de la vista.
      const mctx = document.createElement("canvas").getContext("2d");
      mctx.font = '400 64px "DM Sans"';
      const w = (str) => mctx.measureText(str.replace(/ /g, "\u00a0")).width;
      let li = 0;
      SUCIA.forEach((linea, n) => {
        let sucioAntes = "", limpioAntes = "";
        linea.forEach((ch) => {
          const extra = ch.startsWith("+");
          const c = extra ? ch.slice(1) : ch;
          const l = letras[li++];
          if (!extra) {
            l.dx = w(limpioAntes) - w(sucioAntes);
            l.dy = 0;
            limpioAntes += c;
          }
          sucioAntes += c;
        });
      });
      const esenciales = letras.filter((l) => !l.extra);

      tl.fromTo("#s4-breve-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.85);
      tl.fromTo("#s4-sucia", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.95);
      // Las letras de sobra caen (3.0 s)
      letras.filter((l) => l.extra).forEach((l, i) =>
        tl.fromTo(l.el, { y: 0, rotation: 0, opacity: 1 }, { y: 700 + rnd() * 300, rotation: (rnd() - 0.5) * 140, opacity: 0, duration: 0.55, ease: "power2.in", immediateRender: false }, 3.0 + i * 0.05));
      // Lo esencial se ordena y encastra con un clic (3.85 s)
      esenciales.forEach((l) =>
        tl.fromTo(l.el, { x: 0, y: 0 }, { x: l.dx, y: l.dy, duration: 0.3, ease: "expo.inOut", immediateRender: false }, 3.55));
      tl.fromTo("#s4-subraya", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "expo.out" }, 3.85);
      tl.fromTo("#s4-cam", { y: 0 }, { y: 0, duration: 0.001, immediateRender: false }, 3.85);
      tl.to("#s4-cam", { y: 6, duration: 0.03, ease: "none" }, 3.85);
      tl.to("#s4-cam", { y: 0, duration: 0.12, ease: "power3.out" }, 3.88);
      window.__timelines["s04-corto-breve"] = tl;
    };
    Promise.all([document.fonts.load('700 84px "DM Sans"'), document.fonts.load('400 64px "DM Sans"')]).then(build);
  </script>
</template>
