<template>
  <style>
    @font-face { font-family: "DM Sans"; font-weight: 300; font-style: italic; src: url("assets/fonts/dm-sans-latin-300-italic.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; font-family: "DM Sans", sans-serif; color: #fff; }
    #s5-cam { position: absolute; inset: 0; transform-origin: 30% 45%; }
    #s5-cita { position: absolute; left: 110px; width: 860px; top: 640px; font-weight: 300; font-style: italic;
      font-size: 100px; line-height: 1.1; letter-spacing: -0.01em; }
    #s5-cita .c { opacity: 0; }
    #s5-firma { position: absolute; left: 114px; top: 1040px; font-weight: 400; font-size: 42px; color: #888888; opacity: 0; letter-spacing: .02em; }
  </style>
  <div id="root" data-composition-id="s05-chejov" data-width="1080" data-height="1920">
    <div id="s5-cam">
      <div id="s5-cita"></div>
      <div id="s5-firma">— Chéjov</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const LINEAS = ["“La brevedad", "es hermana", "del talento.”"];
    const cita = document.querySelector("#s5-cita");
    const chars = [];
    LINEAS.forEach((l, li) => {
      [...l].forEach((ch) => {
        const s = document.createElement("span");
        s.className = "c";
        s.textContent = ch;
        cita.appendChild(s);
        if (ch !== " ") chars.push(s);
      });
      if (li < LINEAS.length - 1) cita.appendChild(document.createElement("br"));
    });
    // Corte seco desde la escena anterior: la escritura empieza enseguida (tipeo de sound.py: 0.1 s, cada 0.035 s)
    chars.forEach((s, i) => {
      const t = 0.1 + i * 0.035;
      tl.fromTo(s, { opacity: 0, textShadow: "0 0 0px rgba(255,255,255,0)" },
        { opacity: 1, textShadow: "0 0 26px rgba(255,255,255,.9)", duration: 0.04, ease: "none", immediateRender: false }, t);
      tl.to(s, { textShadow: "0 0 0px rgba(255,255,255,0)", duration: 0.45, ease: "power2.out" }, t + 0.05);
    });
    tl.fromTo("#s5-firma", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.4);
    // Cámara: deriva lenta hacia la cita
    tl.fromTo("#s5-cam", { scale: 1.04, y: 20 }, { scale: 1.0, y: 0, duration: 3.4, ease: "power2.out" }, 0);

    window.__timelines["s05-chejov"] = tl;
  </script>
</template>
