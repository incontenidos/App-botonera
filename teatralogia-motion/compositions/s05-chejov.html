<template>
  <style>
    @font-face { font-family: "DM Sans"; font-weight: 300; font-style: italic; src: url("assets/fonts/dm-sans-latin-300-italic.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; font-family: "DM Sans", sans-serif; color: #fff; }
    #s5-cam { position: absolute; inset: 0; transform-origin: 30% 45%; }
    #s5-cita { position: absolute; left: 110px; width: 860px; top: 640px; font-weight: 300; font-style: italic;
      font-size: 100px; line-height: 1.1; letter-spacing: -0.01em; }
    #s5-cita .c { opacity: 0; }
    #s5-firma { position: absolute; left: 114px; top: 1040px; font-weight: 400; font-size: 42px; color: #888888; opacity: 0; letter-spacing: .02em; }
    #s5-humo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="s05-chejov" data-width="1080" data-height="1920">
    <div id="s5-cam">
      <div id="s5-cita"></div>
      <div id="s5-firma">— Chéjov</div>
    </div>
    <canvas id="s5-humo" width="1080" height="1920" data-layout-ignore></canvas>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const LINEAS = ["“La brevedad", "es hermana", "del talento.”"];
    const cita = document.querySelector("#s5-cita");
    const chars = [];
    LINEAS.forEach((l, li) => {
      [...l].forEach((ch) => {
        const s = document.createElement("span");
        s.className = "c";
        s.textContent = ch;
        cita.appendChild(s);
        if (ch !== " ") chars.push(s);
      });
      if (li < LINEAS.length - 1) cita.appendChild(document.createElement("br"));
    });
    // Escritura letra por letra con un brillo suave que se apaga (alineado al tipeo de sound.py: 0.6 s, cada 0.035 s)
    chars.forEach((s, i) => {
      const t = 0.6 + i * 0.035;
      tl.fromTo(s, { opacity: 0, textShadow: "0 0 0px rgba(255,255,255,0)" },
        { opacity: 1, textShadow: "0 0 26px rgba(255,255,255,.9)", duration: 0.04, ease: "none", immediateRender: false }, t);
      tl.to(s, { textShadow: "0 0 0px rgba(255,255,255,0)", duration: 0.45, ease: "power2.out" }, t + 0.05);
    });
    tl.fromTo("#s5-firma", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.95);
    // Cámara: deriva lenta hacia la cita
    tl.fromTo("#s5-cam", { scale: 1.04, y: 20 }, { scale: 1.0, y: 0, duration: 4, ease: "power2.out" }, 0);

    // Humo/tinta: volutas con semilla que suben, cubren y se disipan dejando ver la cita
    let seed = 0x7a1e;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const vol = Array.from({ length: 80 }, () => ({
      x: 120 + rnd() * 840, y: 1500 + rnd() * 500, r: 70 + rnd() * 220,
      vx: (rnd() - 0.5) * 520, vy: -(700 + rnd() * 900), sw: rnd() * 6.28, d: rnd() * 0.35,
    }));
    const cv = document.querySelector("#s5-humo");
    const ctx = cv.getContext("2d");
    const paint = (t) => {
      ctx.clearRect(0, 0, 1080, 1920);
      if (t > 1.9) return;
      for (const v of vol) {
        const k = Math.max(0, t - v.d);
        if (k <= 0) continue;
        const grow = 1 + k * 1.4;
        const x = v.x + v.vx * k + Math.sin(k * 3 + v.sw) * 60;
        const y = v.y + v.vy * k * (1 - k * 0.25);
        const a = Math.min(1, k / 0.25) * Math.max(0, 1 - Math.max(0, t - 0.75) / 1.0) * 0.2;
        const g = ctx.createRadialGradient(x, y, 0, x, y, v.r * grow);
        g.addColorStop(0, "rgba(235,235,235," + a + ")");
        g.addColorStop(0.5, "rgba(200,200,200," + a * 0.45 + ")");
        g.addColorStop(1, "rgba(160,160,160,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, v.r * grow, 0, 6.2832);
        ctx.fill();
      }
    };
    const reloj = { t: 0 };
    tl.fromTo(reloj, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => paint(reloj.t) }, 0);
    window.__timelines["s05-chejov"] = tl;
  </script>
</template>
