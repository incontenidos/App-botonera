<template>
  <style>
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; font-family: "DM Sans", sans-serif; pointer-events: none; }
    /* Esquina superior derecha, debajo de la barra superior de Reels */
    #reloj-t { position: absolute; right: 110px; top: 300px; font-weight: 400; font-size: 36px; color: #888888;
      letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  </style>
  <div id="root" data-composition-id="reloj" data-width="1080" data-height="1920">
    <div id="reloj-t">00:00</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Tiempo que muestra el cronómetro según el tiempo real del video. Al congelarse marca 00:52, la duración exacta del video:
    //  0–21.4 s normal · 21.4–27.4 s se acelera (scroll) · 27.4–31.4 s congelado (frenada) · 31.4–41.4 s normal · 41.4 s se congela (apagón)
    const TOTAL = 52, ACEL = (TOTAL - 10 - 21.4) / 6;
    const mostrado = (t) => {
      if (t < 21.4) return t;
      if (t < 27.4) return 21.4 + (t - 21.4) * ACEL;
      if (t < 31.4) return 21.4 + 6 * ACEL;
      if (t < 41.4) return 21.4 + 6 * ACEL + (t - 31.4);
      return TOTAL;
    };
    let seed = 0x71c;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const JIT = Array.from({ length: 400 }, () => [rnd() - 0.5, rnd() - 0.5]);
    const el = document.querySelector("#reloj-t");
    const st = { t: 0 };
    const paint = () => {
      const t = st.t;
      const v = Math.floor(mostrado(t));
      el.textContent = String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
      // Tiembla mientras se satura la pantalla (escena 2) y con el golpe de la frenada
      let amp = 0;
      if (t > 6.2 && t < 8.6) amp = (t - 6.2) * 5;
      if (t >= 27.4 && t < 27.75) amp = 18 * (1 - (t - 27.4) / 0.35);
      const j = JIT[Math.floor(t * 30) % JIT.length];
      el.style.transform = "translate(" + (j[0] * amp).toFixed(1) + "px," + (j[1] * amp).toFixed(1) + "px)";
      // Corte a negro de la escena 2 (8.6–9.0): desaparece. Apagón (41.4): se congela y se apaga último (41.9)
      el.style.opacity = (t >= 8.6 && t < 9.0) || t >= 41.9 ? 0 : 1;
      // Mientras se acelera, se pone blanco
      el.style.color = t >= 21.4 && t < 27.4 ? "#ffffff" : "#888888";
    };
    tl.fromTo(st, { t: 0 }, { t: 42.2, duration: 42.2, ease: "none", onUpdate: paint }, 0);
    window.__timelines["reloj"] = tl;
  </script>
</template>
