<template>
  <style>
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 700; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; font-family: "DM Sans", sans-serif; color: #fff; }
    #s2-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #s2-frase { position: absolute; left: 110px; width: 860px; top: 760px; text-align: center;
      font-weight: 400; font-size: 80px; line-height: 1.08; letter-spacing: -0.02em; z-index: 5; }
    #s2-frase .w { display: inline-block; opacity: 0; }
    #s2-frase b { font-weight: 700; }
    #s2-pila { position: absolute; inset: 0; }
    .s2-card { position: absolute; width: 560px; padding: 20px 26px; border-radius: 26px;
      background: rgba(18,18,18,.94); border: 1.5px solid #3a3a3a; box-shadow: 0 18px 40px rgba(0,0,0,.7);
      opacity: 0; }
    .s2-card .meta { font-size: 28px; color: #888888; letter-spacing: .06em; }
    .s2-card .txt { margin-top: 6px; font-size: 32px; line-height: 1.15; color: #fff; }
    #s2-flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: difference; z-index: 9; }
  </style>
  <div id="root" data-composition-id="s02-acusacion" data-width="1080" data-height="1920">
    <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="s2-pila" data-layout-ignore></div>
      <div id="s2-frase">
        <span class="w" id="s2-w0">Dicen</span> <span class="w" id="s2-w1">que</span> <span class="w" id="s2-w2">ya</span>
        <span class="w" id="s2-w3">no</span> <span class="w" id="s2-w4">sabemos</span> <span class="w" id="s2-w5"><b>prestar</b></span>
        <span class="w" id="s2-w6"><b>atención</b></span>
      </div>
    </div>
    <div id="s2-flash"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Tiempos de las notificaciones: los mismos que usa tools/sound.py (cues.json → notif)
    const NOTIF = [1.6, 1.94, 2.246, 2.521, 2.769, 2.992, 3.193, 3.374, 3.537, 3.684, 3.816, 3.935, 4.042, 4.138, 4.225, 4.303, 4.37, 4.433, 4.49];
    const META = ["AHORA", "HACE 1 MIN", "AHORA", "NUEVO", "HACE 2 S", "AHORA"];
    // PRNG con semilla: todo el caos es reproducible cuadro a cuadro
    let seed = 0x5eed;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const pila = document.querySelector("#s2-pila");
    const cards = [];
    NOTIF.forEach((t0, i) => {
      const copies = 1 + Math.floor(i / 3); // cada vez más copias por golpe
      for (let c = 0; c < copies; c++) {
        const el = document.createElement("div");
        el.className = "s2-card";
        el.innerHTML = '<div class="meta">' + META[(i + c) % META.length] + '</div><div class="txt">Dicen que ya no sabemos prestar atención</div>';
        pila.appendChild(el);
        cards.push({ el, t0: t0 + c * 0.03,
          x: -60 + rnd() * 640, y: 200 + rnd() * 1500, rot: (rnd() - 0.5) * 9,
          f: 18 + rnd() * 22, ph: rnd() * 6.28, z: i * 3 + c });
      }
    });
    // Una sola función del tiempo pinta toda la pila (aparición con pop, vuelo desde el centro y vibración creciente)
    const paint = (t) => {
      for (const c of cards) {
        const k = t - c.t0;
        if (k < 0) { c.el.style.opacity = 0; continue; }
        const fly = Math.min(1, k / 0.18);
        const e = 1 - Math.pow(1 - fly, 4);
        const pop = k < 0.18 ? 0.6 + 0.48 * e : 1 + 0.08 * Math.exp(-(k - 0.18) * 18);
        const amp = Math.max(0, t - 2.2) * 8; // vibración que crece hasta saturar
        const jx = Math.sin(t * c.f + c.ph) * amp, jy = Math.cos(t * c.f * 1.3 + c.ph) * amp;
        const x = 260 + (c.x - 260) * e + jx, y = 880 + (c.y - 880) * e + jy;
        c.el.style.opacity = 1;
        c.el.style.zIndex = c.z;
        c.el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + c.rot * e + "deg) scale(" + pop + ")";
      }
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 4.6, duration: 4.6, ease: "none", onUpdate: () => paint(clock.t) }, 0);
    // La frase aparece palabra por palabra
    [0, 0.18, 0.34, 0.5, 0.68, 0.9, 1.1].forEach((t, i) =>
      tl.fromTo("#s2-w" + i, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, t));
    // ...y se fragmenta: queda enterrada por sus propias copias
    tl.to("#s2-frase", { scale: 0.86, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.7);
    // Cámara: sacudidas cada vez más fuertes y glitch final
    tl.fromTo("#s2-cam", { x: 0, y: 0, skewX: 0 }, { x: 0, duration: 0.001 }, 0);
    [3.9, 4.15, 4.38].forEach((t, i) => {
      tl.to("#s2-cam", { x: (i % 2 ? 1 : -1) * (24 + i * 16), skewX: (i % 2 ? -1 : 1) * (6 + i * 3), duration: 0.03, ease: "none" }, t);
      tl.to("#s2-cam", { x: 0, skewX: 0, duration: 0.06, ease: "power4.out" }, t + 0.05);
      tl.fromTo("#s2-flash", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, t);
      tl.to("#s2-flash", { opacity: 0, duration: 0.001 }, t + 0.067);
    });
    tl.to("#s2-cam", { scale: 1.08, duration: 1.7, ease: "power2.in" }, 2.9);
    window.__timelines["s02-acusacion"] = tl;
  </script>
</template>
