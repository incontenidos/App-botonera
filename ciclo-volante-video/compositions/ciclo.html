<template>

      font-family: "Inter", sans-serif; font-weight: 900; font-size: 30px; line-height: 1.2;

    #c-titulo { position: absolute; left: 120px; width: 780px; top: 430px; text-align: center; font-size: 110px; line-height: 1.0; letter-spacing: -0.02em; color: var(--mostaza); }
    #c-bajada { position: absolute; left: 120px; width: 780px; top: 680px; text-align: center; font-family: "Inter", sans-serif; font-weight: 900; font-size: 50px; line-height: 1.15; }
    #c-obras { position: absolute; left: 150px; width: 720px; top: 830px; }
    .c-obra {
      display: block; margin-bottom: 20px; padding: 18px 30px; border-radius: 18px;
      background: var(--crema); color: var(--fondo); text-align: center;
      font-size: 46px; line-height: 1.1; box-shadow: 0 10px 0 rgba(0,0,0,.35);
    }
    .c-obra.ph { background: transparent; color: var(--crema); border: 4px dashed rgba(251,239,213,.7); box-shadow: none; font-family: "Inter", sans-serif; font-weight: 900; font-size: 40px; }
    #c-novicia { background: var(--rojo); color: var(--crema); }
  </style>
  <div id="root" data-composition-id="ciclo" data-width="1080" data-height="1920">
    <div id="c-logo">LOGO CICLO VOLANTE<br />(placeholder)</div>
    <h2 id="c-titulo">Ciclo<br />Volante:</h2>
    <p id="c-bajada">obras breves,<br />una detrás de la otra</p>
    <!-- PLACEHOLDER: títulos de las obras de hoy, sacarlos del Instagram del ciclo -->
    <div id="c-obras" data-layout-allow-overlap>
      <span class="c-obra ph" id="c-obra1">[Título obra 1]</span>
      <span class="c-obra" id="c-novicia">La novicia equivocada</span>
      <span class="c-obra ph" id="c-obra3">[Título obra 3]</span>
      <span class="c-obra ph" id="c-obra4">[Título obra 4]</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#c-logo", { scale: 0.2, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, 0);
    tl.fromTo("#c-titulo", { y: -140, scale: 0.5, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.8)" }, 0.12);
    tl.fromTo("#c-bajada", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.4);
    // Cascada: cada título cae desde arriba con rebote, inclinado como un ticket
    const obras = ["#c-obra1", "#c-novicia", "#c-obra3", "#c-obra4"];
    obras.forEach((id, i) => {
      const rot = i % 2 ? 2.5 : -2.5;
      tl.fromTo(id, { y: -500, rotation: rot * 6, opacity: 0 },
        { y: 0, rotation: rot, opacity: 1, duration: 0.55, ease: "bounce.out" }, 0.75 + i * 0.22);
    });
    tl.to("#c-novicia", { scale: 1.08, duration: 0.25, ease: "power2.out" }, 2.5);
    window.__timelines["ciclo"] = tl;
