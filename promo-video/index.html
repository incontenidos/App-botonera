<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Color de acento","default":"#ffd23f"},
    {"id":"ground","type":"color","label":"Fondo","default":"#14121f"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #14121f;
        --accent: #ffd23f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 0%, #2b2350 0, transparent 55%),
          radial-gradient(circle at 90% 100%, #241f3d 0, transparent 50%),
          var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15.4"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="sources" data-composition-id="sources" data-composition-src="compositions/sources.html"
        data-start="3.4" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="show" data-composition-id="show" data-composition-src="compositions/show.html"
        data-start="7.6" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="11.8" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Sonidos: uisfx (pack "rubber", licencia MIT, assets/sfx/LICENSE-uisfx.txt) -->
      <audio id="sfx-pop1" class="clip" data-duration="0.18" data-start="0.5" data-track-index="3" data-volume="0.5" src="assets/sfx/snap.mp3"></audio>
      <audio id="sfx-pop2" class="clip" data-duration="0.18" data-start="0.8" data-track-index="3" data-volume="0.5" src="assets/sfx/snap.mp3"></audio>
      <audio id="sfx-pop3" class="clip" data-duration="0.18" data-start="1.1" data-track-index="3" data-volume="0.5" src="assets/sfx/snap.mp3"></audio>
      <audio id="sfx-press1" class="clip" data-duration="0.18" data-start="2.3" data-track-index="3" data-volume="0.9" src="assets/sfx/press.mp3"></audio>
      <audio id="sfx-swipe1" class="clip" data-duration="0.37" data-start="3.5" data-track-index="3" data-volume="0.7" src="assets/sfx/swipe.mp3"></audio>
      <audio id="sfx-word1" class="clip" data-duration="0.18" data-start="4.2" data-track-index="3" data-volume="0.5" src="assets/sfx/press.mp3"></audio>
      <audio id="sfx-word2" class="clip" data-duration="0.18" data-start="4.9" data-track-index="3" data-volume="0.5" src="assets/sfx/press.mp3"></audio>
      <audio id="sfx-word3" class="clip" data-duration="0.18" data-start="5.6" data-track-index="3" data-volume="0.5" src="assets/sfx/press.mp3"></audio>
      <audio id="sfx-word4" class="clip" data-duration="0.18" data-start="6.3" data-track-index="3" data-volume="0.5" src="assets/sfx/press.mp3"></audio>
      <audio id="sfx-swipe2" class="clip" data-duration="0.37" data-start="7.7" data-track-index="3" data-volume="0.7" src="assets/sfx/swipe.mp3"></audio>
      <audio id="sfx-go" class="clip" data-duration="0.45" data-start="9.6" data-track-index="3" data-volume="1" src="assets/sfx/start.mp3"></audio>
      <audio id="sfx-logo" class="clip" data-duration="0.68" data-start="11.95" data-track-index="3" data-volume="0.9" src="assets/sfx/success.mp3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
